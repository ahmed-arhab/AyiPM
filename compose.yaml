# Local Postgres for development: `docker compose up -d`.
# The credentials match the defaults in backend/src/main/resources/application.yml.
services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_DB: ayipm
      POSTGRES_USER: ayipm
      POSTGRES_PASSWORD: ayipm
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ayipm -d ayipm"]
      interval: 5s
      retries: 10

volumes:
  postgres-data:
