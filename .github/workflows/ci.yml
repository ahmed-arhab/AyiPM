name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      # Fails when src/types/api.generated.ts doesn't match backend/openapi.json. See "API types" in CONTRIBUTING.md.
      - run: npm run generate:api && git diff --exit-code -- src/types/api.generated.ts
      - run: npx tsc --noEmit
      - run: npm test
      - run: npm run build

  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven
      # Tests start their own embedded Postgres, so no database service is needed.
      - run: ./mvnw -B verify
      # The tests save the spec to openapi.json, so this fails when the committed copy is out of date.
      - run: git diff --exit-code -- openapi.json

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the backend and frontend images
        run: docker compose --profile app build
