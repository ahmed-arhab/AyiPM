<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 184 56" role="img" aria-label="AyiPM">
  <style>
    .from { stop-color: #353E4E; }
    .to { stop-color: #111827; }
    .fg { stroke: #FFFFFF; fill: #FFFFFF; }
    .word { fill: #111827; font: 800 31px 'Plus Jakarta Sans', 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; letter-spacing: -0.6px; }
    .accent { fill: #8C97A8; }
    @media (prefers-color-scheme: dark) {
      .from { stop-color: #FFFFFF; }
      .to { stop-color: #D5DCE6; }
      .fg { stroke: #111827; fill: #111827; }
      .word { fill: #F7F9FC; }
    }
  </style>
  <defs>
    <linearGradient id="tile" x1="4" y1="4" x2="52" y2="52" gradientUnits="userSpaceOnUse">
      <stop offset="0" class="from"/>
      <stop offset="1" class="to"/>
    </linearGradient>
  </defs>
  <rect x="4" y="4" width="48" height="48" rx="12" fill="url(#tile)"/>
  <path class="fg" d="M17.5 39 28 16.5 38.5 39" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round" style="fill: none"/>
  <circle class="fg" cx="28" cy="34" r="3"/>
  <text x="64" y="39" class="word">Ayi<tspan class="accent">PM</tspan></text>
</svg>
