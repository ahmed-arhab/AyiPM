spring:
  application:
    name: ayipm-backend
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/ayipm}
    username: ${DATABASE_USERNAME:ayipm}
    password: ${DATABASE_PASSWORD:ayipm}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  # Email is sent only when SPRING_MAIL_HOST is set (with SPRING_MAIL_PORT, SPRING_MAIL_USERNAME and
  # SPRING_MAIL_PASSWORD as needed). Without it, emails are written to the log instead.
  mail:
    properties:
      # Give up on an unresponsive mail server instead of waiting forever (milliseconds).
      "[mail.smtp.connectiontimeout]": 10000
      "[mail.smtp.timeout]": 10000
      "[mail.smtp.writetimeout]": 10000
      # Encrypt the connection whenever the server supports it.
      "[mail.smtp.starttls.enable]": true

ayipm:
  # The address people open the app at. Links in emails point here.
  public-url: ${PUBLIC_URL:http://localhost:3000}
  mail:
    from: "${MAIL_FROM:AyiPM <no-reply@localhost>}"

server:
  port: ${PORT:8080}
  # Trust X-Forwarded-* from the Next.js proxy so the session cookie is marked Secure behind HTTPS.
  forward-headers-strategy: framework

management:
  endpoints:
    web:
      exposure:
        include: health
  health:
    mail:
      # A mail server outage shouldn't mark the API as down.
      enabled: false
