spring:
  application:
    name: ayipm-backend
    # Filled in from pom.xml when Maven builds the app. Shown as the version in the OpenAPI spec.
    version: "@project.version@"
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/ayipm}
    username: ${DATABASE_USERNAME:ayipm}
    password: ${DATABASE_PASSWORD:ayipm}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate

server:
  port: ${PORT:8080}
  # Trust X-Forwarded-* from the Next.js proxy so the session cookie is marked Secure behind HTTPS.
  forward-headers-strategy: framework

management:
  endpoints:
    web:
      exposure:
        include: health

# The OpenAPI spec at /v3/api-docs and Swagger UI at /swagger-ui.html. Set both to false to turn them off.
springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true
  # Every endpoint returns JSON; without this the spec lists each response as */*.
  default-produces-media-type: application/json
